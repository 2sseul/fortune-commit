<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>운세 일기 · fortune-commit</title>
  <meta name="description" content="쿠키를 연 날마다 도장이 찍히는 운세 일기. 지난 날의 운세를 다시 볼 수 있어요.">
  <link rel="icon" href="/cookies/plain.svg">
  <link rel="modulepreload" href="/site.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=Gaegu:wght@700&family=Nunito:wght@800;900&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* 운세 일기 페이지 (v3.2) — Figma에는 아직 없는 화면이라, 같은 디자인 시스템(카드·도장·태그)으로 만들었다. */
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .summary .card { display: grid; gap: 4px; justify-items: center; text-align: center; }
    .summary img { width: 32px; height: 32px; }
    .summary b { font: 900 32px/1 var(--number); color: var(--caramel); }
    .summary .sky b { color: var(--lip-sky); }
    .summary span { font-size: 13px; color: var(--text-2); }
    @media (max-width: 760px) { .summary { gap: 8px; } .summary .card { padding: 12px 8px; } .summary b { font-size: 24px; } .summary span { font-size: 12px; } }

    .month-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .month-head h2 { font: 900 22px/1 var(--body); }
    .month-head button { width: 44px; height: 44px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; background: var(--paper); font-size: 18px; cursor: pointer; }
    .month-head button:disabled { opacity: 0.35; cursor: default; }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; max-width: 480px; margin: 0 auto; }
    .calendar .dow { text-align: center; font-size: 12px; color: var(--muted); }
    .day { position: relative; display: grid; place-items: center; aspect-ratio: 1; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; font: 800 13px/1 var(--number); color: var(--text-2); }
    .day::before { content: ''; position: absolute; inset: 6% 6% 14%; border-radius: 50%; background: var(--c, #F2F2F2); box-shadow: 0 4px 0 var(--lip, #E2E2E2); }
    .day span { position: relative; margin-top: -8%; }
    .day img { position: relative; width: 46%; margin-top: -8%; }
    .day.done { --c: var(--butter); --lip: #E0A800; color: var(--text); }
    .day.great { --c: #FFC66B; --lip: var(--lip-caramel); }
    .day.legend { --c: linear-gradient(135deg, #FFF3A6, #FFC800); --lip: #D19A00; }
    .day.legend::before { background: linear-gradient(135deg, #FFF3A6, #FFC800); }
    .day.frozen { --c: #BFE8FF; --lip: #7CC6EE; }
    .day.today { --c: var(--paper); --lip: var(--caramel); }
    .day.today::before { box-shadow: inset 0 0 0 3px var(--caramel), 0 4px 0 var(--caramel); }
    .day.future { cursor: default; opacity: 0.4; }
    .day[aria-pressed="true"]::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; box-shadow: 0 0 0 3px var(--sky); }
    .legend-row { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; font-size: 12px; color: var(--text-2); }
    .legend-row i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -2px; }

    .entry { display: grid; gap: 12px; }
    .entry .slip { padding: 16px 18px; border-radius: 14px; background: #FFFDF6; border: 2px dashed #F0D9A8; font: 700 21px/1.4 var(--note); }
    .entry .slip.legend { background: linear-gradient(135deg, #FFF6C9, #FFE07A); border-color: #E0A800; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; }
    .layout > aside { position: sticky; top: calc(var(--topnav-h) + 24px); }
    @media (max-width: 1024px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; } .layout > aside { position: static; } }
  </style>
</head>
<body>
  <header id="topnav"></header>

  <div class="wrap" style="padding-top: 40px; padding-bottom: 96px; display: grid; gap: 24px">
    <div class="page-title">
      <span class="eyebrow">Fortune diary</span>
      <h1>운세 일기</h1>
      <p class="small lines"><span>쿠키를 연 날마다 도장이 찍혀요.</span><span>도장을 누르면 그날의 운세를 다시 볼 수 있어요.</span></p>
    </div>
    <div id="top"></div>
    <div class="layout" id="layout" hidden>
      <section class="card pad-lg" aria-labelledby="month-title">
        <div class="month-head">
          <button type="button" id="prev" aria-label="이전 달">‹</button>
          <h2 id="month-title"></h2>
          <button type="button" id="next" aria-label="다음 달">›</button>
        </div>
        <div class="calendar" id="calendar"></div>
        <div class="legend-row">
          <span><i style="background:var(--butter)"></i>쿠키를 연 날</span>
          <span><i style="background:#FFC66B"></i>대길</span>
          <span><i style="background:#FFC800"></i>전설</span>
          <span><i style="background:#BFE8FF"></i>냉동 쿠키</span>
        </div>
      </section>
      <aside class="card pad-lg entry" id="entry" aria-live="polite"></aside>
    </div>
  </div>

  <footer id="footer"></footer>

  <script type="module">
    import { setupHeader, setHeaderStats, el, statChip, fortuneSlip } from '/site.js';

    const GRADE = { legend: '전설', great: '대길', good: '길', fair: '중길', small: '소길', bad: '흉' };
    let data = null;
    let month = null; // 'YYYY-MM'
    let picked = null;

    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (date) => { const [, m, d] = date.split('-'); return `${Number(m)}월 ${Number(d)}일`; };

    function renderSummary() {
      const box = (icon, value, label, cls = '') => el('div', { class: `card ${cls}`.trim() }, el('img', { src: icon, alt: '' }), el('b', { text: value }), el('span', { text: label }));
      const opened = Object.values(data.days).filter((n) => n > 0).length;
      document.getElementById('top').replaceChildren(el('div', { class: 'summary' },
        box('/img/icons/flame.svg', String(data.streak), '일 연속'),
        box('/img/icons/trophy.svg', String(data.bestStreak), '최고 기록'),
        box('/img/icons/calendar.svg', String(opened), '올해 연 날', 'sky')));
    }

    function renderMonth() {
      const [y, m] = month.split('-').map(Number);
      document.getElementById('month-title').textContent = `${y}년 ${m}월`;
      const first = new Date(Date.UTC(y, m - 1, 1));
      const length = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const offset = (first.getUTCDay() + 6) % 7; // 월요일부터
      const frozen = new Set(data.frozen);
      const cells = '월화수목금토일'.split('').map((d) => el('span', { class: 'dow', text: d }));
      for (let i = 0; i < offset; i++) cells.push(el('span'));
      for (let d = 1; d <= length; d++) {
        const date = `${y}-${pad(m)}-${pad(d)}`;
        const count = data.days[date] ?? 0;
        let state = '';
        if (date > data.today) state = 'future';
        else if (count > 0) state = `done ${data.grades[date] === 'legend' ? 'legend' : data.grades[date] === 'great' ? 'great' : ''}`;
        else if (frozen.has(date)) state = 'frozen';
        if (date === data.today) state += ' today';
        const button = el('button', { class: `day ${state}`.trim(), type: 'button', 'aria-pressed': String(picked === date), 'aria-label': `${fmt(date)}${count > 0 ? ' 쿠키를 연 날' : ''}`, disabled: date > data.today },
          count > 0 ? el('img', { src: data.grades[date] === 'legend' ? '/cookies/galaxy.svg' : '/img/icons/point.svg', alt: '' }) : el('span', { text: String(d) }));
        button.addEventListener('click', () => pick(date));
        cells.push(button);
      }
      document.getElementById('calendar').replaceChildren(...cells);
      document.getElementById('prev').disabled = m === 1;
      document.getElementById('next').disabled = month >= data.today.slice(0, 7);
    }

    function pick(date) {
      picked = date;
      renderMonth();
      const entry = data.entries[date];
      const opened = (data.days[date] ?? 0) > 0;
      const grade = data.grades[date];
      const box = document.getElementById('entry');
      const head = el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, el('h2', { class: 'h3', text: fmt(date) }),
        grade ? el('span', { class: `tag ${grade === 'legend' ? 'caramel' : ''}`.trim(), text: GRADE[grade] }) : null,
        entry?.ai ? el('span', { class: 'tag purple', text: 'AI 점쟁이' }) : null);
      if (entry) box.replaceChildren(head, fortuneSlip(entry.fortune, grade === 'legend' ? 'legend' : ''), el('p', { class: 'small', text: `그날 기여 ${data.days[date] ?? 0}개` }));
      else if (opened) box.replaceChildren(head, el('p', { class: 'small lines' }, el('span', { text: `그날 기여 ${data.days[date]}개로 쿠키가 열렸어요.` }), el('span', { text: '사이트에서 운세를 본 날부터 문장이 남아요.' })));
      else if (new Set(data.frozen).has(date)) box.replaceChildren(head, el('p', { class: 'small', text: '냉동 쿠키가 이날의 연속 기록을 지켜 줬어요.' }));
      else box.replaceChildren(head, el('p', { class: 'small', text: date === data.today ? '오늘은 아직 쿠키가 닫혀 있어요. 커밋하면 열려요!' : '이날은 쿠키가 열리지 않았어요.' }));
    }

    document.getElementById('prev').addEventListener('click', () => { const [y, m] = month.split('-').map(Number); month = `${y}-${pad(m - 1)}`; renderMonth(); });
    document.getElementById('next').addEventListener('click', () => { const [y, m] = month.split('-').map(Number); month = `${y}-${pad(m + 1)}`; renderMonth(); });

    const me = await setupHeader();
    if (!me.loggedIn) {
      document.getElementById('top').replaceChildren(el('div', { class: 'card pad-lg', style: 'display:grid;gap:12px;justify-items:start' },
        el('h2', { class: 'h3', text: '로그인하면 내 운세 일기가 열려요' }),
        el('p', { class: 'small', text: 'GitHub 기여 달력으로 쿠키를 연 날을 찾아 도장을 찍어 드려요.' }),
        el('a', { class: 'btn', href: '/api/auth/login?next=/diary.html', text: 'GitHub로 로그인' })));
    } else {
      data = await fetch('/api/diary', { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
      if (!data?.loggedIn) document.getElementById('top').replaceChildren(el('p', { class: 'notice', text: '일기를 불러오지 못했어요. 잠시 후 새로고침해 주세요.' }));
      else {
        renderSummary();
        month = data.today.slice(0, 7);
        document.getElementById('layout').hidden = false;
        pick(data.today);
        setHeaderStats({ streak: data.streak, balance: data.balance });
      }
    }
  </script>
</body>
</html>
