<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>내 도감 · fortune-commit</title>
  <meta name="description" content="모은 쿠키 65종의 해금 상황을 보고, 고른 쿠키를 README 위젯에 바로 올리는 도감">
  <link rel="icon" href="/cookies/plain.svg">
  <link rel="modulepreload" href="/site.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&family=Gaegu:wght@700&family=Nunito:wght@800;900&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* 도감 페이지에만 쓰는 스타일 (Figma 📖 Collection · PC / 📱 Collection · Mobile) */
    .page-title h1 b { font: 900 0.62em/1 var(--number); color: var(--caramel); margin-left: 8px; }
    .group { display: grid; }
    .group[hidden] { display: none; }
    .group-head .count { font: 900 16px/1 var(--number); color: var(--text-2); }
    .more-btn { margin-top: 12px; }
    .soon-mobile { display: none; }
    @media (max-width: 1024px) {
      .soon-mobile { display: block; }
      #side .soon { display: none; }
    }
    .login-card { display: grid; gap: 12px; justify-items: start; }
  </style>
</head>
<body>
  <header id="topnav"></header>

  <div class="wrap app">
    <main>
      <div class="page-title">
        <h1>내 도감 <b id="count">0 / 65</b></h1>
        <div id="total-progress"></div>
      </div>
      <div id="notice" hidden></div>
      <div id="top"></div>
      <div class="soon-mobile" id="soon-mobile"></div>
      <nav class="pills" id="category-tabs" aria-label="분류"></nav>
      <div id="groups" style="display:grid;gap:40px"></div>
    </main>
    <aside id="side" aria-label="오늘의 기록"></aside>
  </div>

  <footer id="footer"></footer>

  <script type="module">
    import { setupHeader, setHeaderStats, loadCatalog, cookieSrc, el, progressBar, postJson, toast, renderSidePanel, CATEGORY_LABEL } from '/site.js';

    const ERRORS = { state: '로그인 확인에 실패했어요. 다시 로그인해 주세요.', login: 'GitHub 로그인에 실패했어요. 잠시 후 다시 시도해 주세요.' };
    const isPhone = () => window.matchMedia('(max-width: 760px)').matches;
    const PHONE_LIMIT = 4; // 휴대폰에서는 묶음마다 4개만 먼저 보여준다 (Figma 📱)
    let catalog = { cookies: [] };
    let me = { loggedIn: false };
    let filter = 'all';
    const expanded = new Set();

    // 카드에 쓰는 짧은 해금 조건 (한 줄에 들어가게)
    const shortRule = (c) => c.unlock.replace(/^(.+) 저장소에 커밋 (\d+)개$/, '$1 커밋 $2개').replace('JavaScript', 'JS').replace('TypeScript', 'TS').replace('쿠키 뽑기 ', '뽑기 ');

    const error = new URLSearchParams(location.search).get('login_error') ?? new URLSearchParams(location.search).get('error');
    if (ERRORS[error]) { const box = document.getElementById('notice'); box.className = 'notice'; box.textContent = ERRORS[error]; box.hidden = false; }

    // ---------- 카드 (Figma CollectionCard: Equipped / Unlocked / Locked) ----------
    function card(c, state) {
      const equipped = me.loggedIn && (me.equipped ?? 'plain') === c.id;
      const unlocked = state?.unlocked ?? c.id === 'plain';
      let desc = shortRule(c);
      if (state?.bought) desc = '상점에서 산 쿠키';
      else if (state?.kept) desc = `${shortRule(c)} · 예전에 해금`;
      if (c.category === '뽑기') desc = unlocked ? `${c.rarity} · 뽑기` : `${c.rarity} · 부스러기 ${catalog.gacha.exchange_cost[c.rarity]}개 교환`;

      let slot;
      if (!me.loggedIn) slot = el('span', { class: 'tag', style: 'justify-self:center', text: c.category === '뽑기' ? `${c.rarity} 뽑기` : '해금 조건' });
      else if (equipped) slot = el('button', { class: 'btn small sky block', type: 'button', disabled: true, text: '장착 중' });
      else if (unlocked) {
        slot = el('button', { class: 'btn small secondary block', type: 'button', text: '장착하기' });
        slot.style.color = 'var(--lip-sky)';
        slot.addEventListener('click', () => equip(c, slot));
      } else if (c.category === '뽑기') {
        const crumbs = me.wallet?.crumbs ?? 0;
        const cost = catalog.gacha.exchange_cost[c.rarity];
        slot = progressBar(Math.min(crumbs, cost), cost, `부스러기 ${crumbs} / ${cost}`);
      } else if (state && state.goal > 1) slot = progressBar(state.current, state.goal);
      else slot = el('span', { class: 'tag', style: 'justify-self:center', text: '아직이에요' });

      const node = el('article', { class: `card cookie-card ${equipped ? 'equipped' : ''} ${!unlocked && me.loggedIn ? 'locked' : ''}`.trim(), id: `cookie-${c.id}` },
        equipped ? el('span', { class: 'tag sky badge', text: '장착 중' }) : null,
        el('div', { class: 'stage' }, el('img', { src: cookieSrc(c.id), alt: '', loading: 'lazy' })),
        el('p', { class: 'name', text: c.label }),
        el('p', { class: 'desc', title: c.unlock, text: desc }),
        el('div', { class: 'slot' }, slot));
      return node;
    }

    async function equip(c, button) {
      button.disabled = true;
      button.textContent = '올리는 중…';
      const { ok, data } = await postJson('/api/me', { skin: c.id });
      if (!ok) { toast(data.error ?? '저장하지 못했어요.'); button.disabled = false; button.textContent = '장착하기'; return; }
      me.equipped = data.equipped;
      toast(`${c.label}를 위젯에 올렸어요!`);
      render();
      renderSide(); // 오른쪽 '장착 중인 쿠키'도 바로 바꾼다
    }

    // ---------- 그리기 ----------
    function render() {
      const states = Object.fromEntries((me.skins ?? []).map((s) => [s.id, s]));
      const total = catalog.cookies.length;
      const have = catalog.cookies.filter((c) => states[c.id]?.unlocked || c.id === 'plain').length;
      document.getElementById('count').textContent = `${me.loggedIn ? have : 0} / ${total}`;
      document.getElementById('total-progress').replaceChildren(progressBar(me.loggedIn ? have : 0, total, `${me.loggedIn ? have : 0} / ${total} 모음`));

      // 분류 탭
      const cats = Object.keys(CATEGORY_LABEL).filter((cat) => catalog.cookies.some((c) => c.category === cat));
      const tabs = document.getElementById('category-tabs');
      tabs.replaceChildren(...[['all', `전체 ${total}`], ...cats.map((cat) => [cat, `${CATEGORY_LABEL[cat]} ${catalog.cookies.filter((c) => c.category === cat).length}`])].map(([id, text]) => {
        const b = el('button', { type: 'button', 'aria-pressed': String(filter === id), text });
        b.addEventListener('click', () => { filter = id; render(); });
        return b;
      }));

      // 분류별 묶음
      const groups = document.getElementById('groups');
      groups.replaceChildren(...cats.filter((cat) => filter === 'all' || filter === cat).map((cat) => {
        const list = catalog.cookies.filter((c) => c.category === cat);
        const got = list.filter((c) => states[c.id]?.unlocked || c.id === 'plain').length;
        const head = el('div', { class: 'group-head' }, el('h2', { text: `${CATEGORY_LABEL[cat]} 쿠키` }), me.loggedIn ? el('span', { class: 'count', text: `${got} / ${list.length}` }) : null);
        if (cat === '언어' && me.loggedIn) {
          // 올해 언어별 커밋 수 (많은 순 3개). 커밋한 저장소의 대표 언어로 센다.
          const top = Object.entries(me.languageCommits ?? {}).sort((a, b) => b[1] - a[1]).slice(0, 3);
          head.append(el('span', { class: 'tag sky', title: '가입한 날부터 커밋한 저장소의 대표 언어로 셈 (노트북은 Python, Vue는 JavaScript)', text: top.length ? `커밋 ${top.map(([l, n]) => `${l} ${n}`).join(' · ')}` : '올해 커밋한 언어를 찾지 못했어요' }));
        }
        if (cat === '뽑기') head.append(el('a', { class: 'tag purple', href: '/shop.html#gacha', text: `부스러기 ${me.wallet?.crumbs ?? 0}개 · 상점에서 뽑기 →` }));
        // 해금한 것 먼저, 잠긴 것은 진행률이 높은 순
        const sorted = [...list].sort((a, b) => Number(Boolean(states[b.id]?.unlocked)) - Number(Boolean(states[a.id]?.unlocked)));
        const limited = isPhone() && !expanded.has(cat) && filter === 'all' ? sorted.slice(0, PHONE_LIMIT) : sorted;
        const section = el('section', { class: 'group', 'aria-label': `${CATEGORY_LABEL[cat]} 쿠키` }, head, el('div', { class: 'cookie-grid' }, ...limited.map((c) => card(c, states[c.id]))));
        if (limited.length < sorted.length) {
          const more = el('button', { class: 'btn secondary block more-btn', type: 'button', text: `${sorted.length - limited.length}개 더 보기` });
          more.addEventListener('click', () => { expanded.add(cat); render(); });
          section.append(more);
        }
        return section;
      }));

      // 곧 해금될 쿠키 (휴대폰·태블릿에서는 위쪽에, PC에서는 오른쪽 패널에)
      const soonBox = document.getElementById('soon-mobile');
      soonBox.replaceChildren();
      if (me.loggedIn && me.next?.length) {
        const label = (id) => catalog.cookies.find((c) => c.id === id)?.label ?? id;
        soonBox.append(el('section', { class: 'card' }, el('h2', { class: 'h3', style: 'margin-bottom:12px', text: '곧 해금될 쿠키' }),
          ...me.next.map((n) => el('div', { class: 'quest', style: 'grid-template-columns:36px minmax(0,1fr)' },
            el('span', { class: 'icon' }, el('img', { src: cookieSrc(n.id), alt: '' })),
            el('div', {}, el('p', { class: 'label', text: label(n.id) }), progressBar(n.current, n.goal))))));
      }
    }

    // 오른쪽 패널: 퀘스트, 장착 중인 쿠키, 곧 해금될 쿠키 (장착을 바꾸면 다시 그린다)
    function renderSide() {
      renderSidePanel(document.getElementById('side'), { daily: me.daily, equipped: me.equipped, next: me.next, cookies: catalog.cookies, showNext: true });
      if (me.next?.length) document.querySelector('#side .card:last-child')?.classList.add('soon');
    }

    // 로그인 전: 안내 카드 + 모든 쿠키의 해금 조건
    function renderLoggedOut() {
      document.getElementById('top').replaceChildren(el('div', { class: 'card pad-lg login-card' },
        el('h2', { class: 'h3', text: '로그인하면 내 쿠키 상자가 열려요' }),
        el('p', { class: 'small lines' }, el('span', { text: 'GitHub 활동으로 해금한 쿠키를 모아 보고,' }), el('span', { text: '고른 쿠키를 README 위젯에 바로 올릴 수 있어요.' })),
        el('a', { class: 'btn', href: '/api/auth/login?next=/collection.html', text: 'GitHub로 로그인' })));
    }

    const [header, cat] = await Promise.all([setupHeader(), loadCatalog()]);
    catalog = cat;
    if (!header.loggedIn) {
      renderLoggedOut();
      render();
      document.getElementById('side').hidden = true;
    } else {
      render(); // 먼저 목록을 보여주고, 해금 상태는 불러온 뒤 다시 그린다.
      // /api/me 하나가 쿠키 상태·지갑·퀘스트(daily)를 함께 준다. (GitHub 확인을 한 번만 하게)
      me = await fetch('/api/me', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ loggedIn: true }));
      const daily = me.daily;
      if (!me.activityChecked) document.getElementById('top').replaceChildren(el('p', { class: 'notice', text: 'GitHub 활동을 확인하지 못해서 진행 상황이 0으로 보일 수 있어요. 잠시 후 새로고침해 주세요.' }));
      setHeaderStats({ streak: me.streak, balance: me.wallet?.balance });
      render();
      renderSide();
    }
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView({ block: 'center' });
  </script>
</body>
</html>
