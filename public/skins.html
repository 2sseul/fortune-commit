<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>쿠키 진열대 · fortune-commit</title>
  <meta name="description" content="포춘쿠키 65종을 구경하고 해금 조건과 README 코드를 가져가는 진열대">
  <link rel="icon" href="/cookies/plain.svg">
  <link rel="stylesheet" href="/site.css">
  <style>
    /* 진열대 페이지에만 쓰는 스타일 (Figma 🪟 Showcase · PC / 📱 Showcase · Mobile) */
    .showcase { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 56px; align-items: start; padding-top: 48px; padding-bottom: 96px; }
    .showcase > main { display: grid; gap: 24px; min-width: 0; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; }
    .tile { position: relative; display: grid; place-items: center; aspect-ratio: 1; padding: 0; background: var(--paper); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--r-md); cursor: pointer; transition: transform 0.1s; }
    .tile:hover { transform: translateY(-2px); }
    .tile img { width: 72%; height: 72%; object-fit: contain; }
    .tile[aria-pressed="true"] { border-color: var(--sky); background: var(--sky-tint); }
    .tile .mine { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 2px #fff; }
    .tile.locked img { filter: grayscale(0.15); }

    /* 고른 쿠키 상세 (PC: 오른쪽 카드, 휴대폰: 아래 시트) */
    .detail { position: sticky; top: calc(var(--topnav-h) + 24px); display: grid; gap: 16px; justify-items: center; text-align: center; padding: 24px; }
    .detail .stage { display: grid; place-items: center; width: 100%; height: 220px; border-radius: var(--r-md); background: var(--dough); }
    .detail .stage img { height: 168px; }
    .detail h2 { font: 400 32px/1.2 var(--title); }
    .detail .about { font-size: 14px; color: var(--text-2); }
    .pixel-preview { display: flex; align-items: center; gap: 16px; width: 100%; padding: 12px 16px; border-radius: var(--r-md); background: var(--terminal); text-align: left; }
    .pixel-preview img { width: 72px; height: auto; image-rendering: pixelated; flex: none; }
    .pixel-preview p { font: 12px/1.6 var(--mono); color: #8B949E; }
    .pixel-preview p b { display: block; font-weight: 400; color: #C9D1D9; }
    .detail .code-box { width: 100%; text-align: left; }
    .detail .btn { width: 100%; }
    .sheet-handle, .sheet-close { display: none; }
    .scrim { display: none; }

    @media (max-width: 1024px) {
      .showcase { grid-template-columns: minmax(0, 1fr); padding-top: 24px; padding-bottom: 32px; }
      .tiles { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
      /* 아래 시트: 쿠키를 누르면 아래에서 올라온다 */
      .detail {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 70;
        max-height: min(84dvh, 760px); overflow-y: auto; overscroll-behavior: contain;
        padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
        border-radius: 24px 24px 0 0; border-bottom: 0;
        box-shadow: 0 -6px 24px rgb(0 0 0 / 0.12);
        transform: translateY(105%); transition: transform 0.25s ease-out; visibility: hidden;
      }
      .detail.open { transform: none; visibility: visible; }
      .sheet-handle { display: block; width: 44px; height: 5px; border-radius: 3px; background: #D9D9D9; }
      .sheet-close { display: grid; place-items: center; position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--bg-section); font-size: 18px; cursor: pointer; }
      .scrim { position: fixed; inset: 0; z-index: 65; background: rgb(43 29 20 / 0.45); }
      .scrim.open { display: block; }
      .detail .stage { height: 150px; }
      .detail .stage img { height: 124px; }
      .detail h2 { font-size: 28px; }
    }
    @media (max-width: 360px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } }
  </style>
</head>
<body>
  <header id="topnav"></header>

  <div class="wrap showcase">
    <main>
      <div class="page-title">
        <span class="eyebrow">Cookie showcase</span>
        <h1>쿠키 진열대</h1>
        <p class="small lines pc-only"><span>65종의 쿠키를 구경하고 README 코드를 가져가세요.</span><span>조건을 채우면 내 위젯에 그 쿠키가 나와요.</span></p>
        <p class="small lines m-only"><span>65종의 쿠키를 구경하고</span><span>README 코드를 가져가세요.</span></p>
      </div>
      <nav class="pills" id="category-tabs" aria-label="분류"></nav>
      <div class="tiles" id="tiles" role="list"></div>
    </main>

    <div class="scrim" id="scrim"></div>
    <aside class="card detail" id="detail" aria-live="polite" aria-labelledby="detail-name">
      <span class="sheet-handle"></span>
      <button class="sheet-close" type="button" id="detail-close" aria-label="닫기">✕</button>
      <div class="stage"><img id="detail-img" src="/cookies/plain.svg" alt=""></div>
      <h2 id="detail-name">기본 쿠키</h2>
      <span class="tag" id="detail-rule">처음부터</span>
      <p class="about lines" id="detail-about"></p>
      <div class="pixel-preview">
        <img id="detail-pixel" src="/cookies/pixel/plain.svg" alt="README 위젯에서 보이는 픽셀 쿠키">
        <p><b>README 위젯에서는</b><span id="detail-pixel-text">픽셀 쿠키로 보여요</span></p>
      </div>
      <div class="code-box"><pre id="code"></pre></div>
      <button class="btn" type="button" id="copy">README 코드 복사</button>
      <div id="detail-action" style="width:100%"></div>
    </aside>
  </div>

  <footer id="footer"></footer>

  <script type="module">
    import { setupHeader, setHeaderStats, loadCatalog, cookieSrc, el, copyText, postJson, toast, CATEGORY_LABEL } from '/site.js';

    const origin = window.location.origin;
    // 분류마다 한 줄 소개
    const ABOUT = {
      기존: ['처음부터 함께한 빵집의 단골 쿠키예요.'],
      활동: ['GitHub 활동 습관에서 태어난 쿠키예요.'],
      시즌: ['그 계절에만 구워지는 쿠키예요.'],
      언어: ['가장 많이 쓰는 언어가 같은', '개발자를 좋아해요.'],
      밈: ['개발자라면 한 번쯤 겪어 본', '순간을 담았어요.'],
      특별: ['오래 함께한 사람에게만 찾아와요.'],
      뽑기: ['쿠키 뽑기로만 만날 수 있어요.', '중복이 나오면 부스러기로 바뀌어요.'],
    };
    const narrow = () => window.matchMedia('(max-width: 1024px)').matches;
    let catalog = { cookies: [] };
    let me = { loggedIn: false };
    let filter = 'all';
    let chosen = null;

    const readmeCode = (id) => `[![오늘의 포춘쿠키](${origin}/api?user=YOUR_GITHUB_ID&skin=${id})](${origin}/)`;

    function renderTabs() {
      const cats = Object.keys(CATEGORY_LABEL).filter((cat) => catalog.cookies.some((c) => c.category === cat));
      document.getElementById('category-tabs').replaceChildren(...[['all', `전체 ${catalog.cookies.length}`], ...cats.map((cat) => [cat, CATEGORY_LABEL[cat] + (cat === '뽑기' ? ' 12' : '')])].map(([id, text]) => {
        const b = el('button', { type: 'button', 'aria-pressed': String(filter === id), text });
        b.addEventListener('click', () => { filter = id; renderTabs(); renderTiles(); });
        return b;
      }));
    }

    function renderTiles() {
      const mine = new Set((me.skins ?? []).filter((s) => s.unlocked).map((s) => s.id));
      document.getElementById('tiles').replaceChildren(...catalog.cookies.filter((c) => filter === 'all' || c.category === filter).map((c) => {
        const tile = el('button', { class: 'tile', type: 'button', role: 'listitem', id: c.id, 'aria-pressed': String(chosen === c.id), 'aria-label': `${c.label}${mine.has(c.id) ? ' (내 쿠키)' : ''}` },
          el('img', { src: cookieSrc(c.id), alt: '', loading: 'lazy' }), mine.has(c.id) ? el('span', { class: 'mine', title: '내 쿠키' }) : null);
        tile.addEventListener('click', () => choose(c.id, true));
        return tile;
      }));
    }

    function choose(id, fromTap = false) {
      const c = catalog.cookies.find((x) => x.id === id) ?? catalog.cookies[0];
      chosen = c.id;
      history.replaceState(null, '', `#${c.id}`);
      for (const t of document.querySelectorAll('.tile')) t.setAttribute('aria-pressed', String(t.id === c.id));
      document.getElementById('detail-img').src = cookieSrc(c.id);
      document.getElementById('detail-name').textContent = c.label;
      const rule = document.getElementById('detail-rule');
      rule.textContent = c.category === '뽑기' ? `${c.rarity} · 쿠키 뽑기` : c.unlock;
      rule.className = `tag ${c.category === '뽑기' ? 'purple' : ''}`.trim();
      document.getElementById('detail-about').replaceChildren(...[...(ABOUT[c.category] ?? []), c.category === '뽑기' ? null : '한 번 해금하면 계속 내 거예요.'].filter(Boolean).map((t) => el('span', { text: t })));
      // 위젯 픽셀 미리보기 (레트로 쿠키는 원래 픽셀이라 벡터 그대로)
      const pixel = document.getElementById('detail-pixel');
      pixel.src = c.id === 'retro' ? cookieSrc('retro') : `/cookies/pixel/${c.id}.svg`;
      document.getElementById('detail-pixel-text').textContent = `픽셀 ${c.label}로 보여요`;
      document.getElementById('code').textContent = readmeCode(c.id);

      // 장착 버튼: 로그인 전 → 로그인, 내 쿠키 → 바로 장착, 아직 → 도감/상점 안내
      const action = document.getElementById('detail-action');
      const state = (me.skins ?? []).find((s) => s.id === c.id);
      if (!me.loggedIn) action.replaceChildren(el('a', { class: 'btn secondary', href: `/api/auth/login?next=${encodeURIComponent(`/skins.html#${c.id}`)}`, text: '로그인하고 바로 장착' }));
      else if (me.equipped === c.id || (!me.equipped && c.id === 'plain')) action.replaceChildren(el('button', { class: 'btn sky', type: 'button', disabled: true, text: '위젯에 올라가 있어요' }));
      else if (state?.unlocked) {
        const b = el('button', { class: 'btn secondary', type: 'button', text: '내 위젯에 장착하기' });
        b.addEventListener('click', async () => {
          b.disabled = true;
          const { ok, data } = await postJson('/api/me', { skin: c.id });
          if (!ok) { toast(data.error ?? '저장하지 못했어요.'); b.disabled = false; return; }
          me.equipped = data.equipped;
          toast(`${c.label}를 위젯에 올렸어요!`);
          choose(c.id);
        });
        action.replaceChildren(b);
      } else if (c.category === '뽑기') action.replaceChildren(el('a', { class: 'btn secondary', href: '/shop.html#gacha', text: '상점에서 뽑기' }));
      else action.replaceChildren(el('a', { class: 'btn secondary', href: `/collection.html#cookie-${c.id}`, text: state ? `도감에서 진행 보기 (${state.current} / ${state.goal})` : '도감에서 진행 보기' }));

      if (fromTap && narrow()) openSheet();
    }

    // 휴대폰·태블릿: 아래 시트 열고 닫기
    const detail = document.getElementById('detail');
    const scrim = document.getElementById('scrim');
    let lastTile = null;
    function openSheet() {
      lastTile = document.activeElement;
      detail.classList.add('open');
      scrim.classList.add('open');
      document.getElementById('detail-close').focus({ preventScroll: true });
    }
    function closeSheet() {
      detail.classList.remove('open');
      scrim.classList.remove('open');
      lastTile?.focus?.({ preventScroll: true });
    }
    document.getElementById('detail-close').addEventListener('click', closeSheet);
    scrim.addEventListener('click', closeSheet);
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeSheet(); });
    document.getElementById('copy').addEventListener('click', (event) => copyText(event.currentTarget, readmeCode(chosen)));

    const [header, cat] = await Promise.all([setupHeader(), loadCatalog()]);
    catalog = cat;
    renderTabs();
    renderTiles();
    choose(location.hash.slice(1) || 'santa');
    if (location.hash) document.getElementById(chosen)?.scrollIntoView({ block: 'center' });
    if (header.loggedIn) {
      me = await fetch('/api/me', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ loggedIn: true }));
      setHeaderStats({ streak: me.streak, balance: me.wallet?.balance });
      renderTiles();
      choose(chosen);
    }
  </script>
</body>
</html>
