<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fortune-commit</title>
  <meta name="description" content="GitHub README에 붙이는 오늘의 개발자 운세 포춘쿠키 위젯">
  <style>
    /* 예시 갤러리 페이지 스타일: 위젯과 같은 터미널 느낌 */
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --green: #3fb950;
      --yellow: #f2cc60;
      --orange: #ffa657;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'D2Coding', 'SF Mono', Menlo, Consolas, 'Apple SD Gothic Neo', 'Noto Sans KR', monospace;
      line-height: 1.6;
    }
    main { max-width: 1080px; margin: 0 auto; padding: 48px 16px 64px; }
    h1 { margin: 0; font-size: 28px; }
    h1 .prompt { color: var(--green); }
    .lead { color: var(--muted); margin: 8px 0 0; }
    .steps {
      margin: 28px 0 36px;
      padding: 16px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .steps ol { margin: 0; padding-left: 20px; }
    .steps code { color: var(--orange); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 495px), 1fr));
      gap: 24px;
    }
    .example {
      min-width: 0; /* 긴 코드 줄 때문에 카드가 화면 밖으로 넓어지지 않게 */
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .example h2 { margin: 0 0 12px; font-size: 15px; color: var(--yellow); }

    /* 위젯 미리보기: 밝은 테마 예시는 밝은 바탕 위에 보여준다 */
    .preview { border-radius: 8px; padding: 12px; }
    .preview.dark { background: #0d1117; }
    .preview.light { background: #ffffff; }
    .preview img { display: block; max-width: 100%; height: auto; margin: 0 auto; cursor: pointer; }
    .preview figcaption { margin-top: 6px; font-size: 12px; text-align: center; color: #8b949e; }

    /* 추천 카드(자동 전환)는 한 줄을 다 쓰고, 다크·라이트 미리보기를 나란히 보여준다 */
    .example.featured { grid-column: 1 / -1; border-color: var(--green); }
    .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; }

    .code { margin-top: 12px; }
    .code pre {
      margin: 0;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--muted);
      overflow-x: auto;
    }
    .code button {
      margin-top: 8px;
      width: 100%;
      padding: 8px 14px;
      background: var(--green);
      color: #0d1117;
      border: 0;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .code button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1><span class="prompt">$</span> fortune-commit</h1>
    <p class="lead">GitHub README에 붙이는 오늘의 개발자 운세 포춘쿠키 위젯</p>

    <section class="steps" aria-label="사용 방법">
      <ol>
        <li>마음에 드는 예시의 <strong>코드 복사</strong>를 누릅니다. 맨 위 자동 전환 버전을 추천해요.</li>
        <li>README에 붙여 넣고, <code>YOUR_GITHUB_ID</code>를 본인 GitHub 아이디로 바꿉니다. (모두 바꿔 주세요)</li>
        <li>끝! 오늘 커밋(기여)을 하기 전에는 쿠키가 잠겨 있고, 커밋하면 쿠키가 열리며 오늘의 운세가 나옵니다.</li>
      </ol>
    </section>

    <!-- 예시 카드는 아래 스크립트가 EXAMPLES 목록으로 만든다 -->
    <div class="grid" id="examples"></div>

    <footer>
      옵션(너비, 모서리, 시간대 등)은
      <a href="https://github.com/2sseul/fortune-commit#readme">README</a>에서 볼 수 있어요.
    </footer>
  </main>

  <script>
    // 갤러리에 보여줄 예시 목록 (다크/라이트 × 한국어/영어)
    const EXAMPLES = [
      { title: '다크 · 한국어', theme: 'dark', lang: 'ko' },
      { title: '라이트 · 한국어', theme: 'light', lang: 'ko' },
      { title: 'Dark · English', theme: 'dark', lang: 'en' },
      { title: 'Light · English', theme: 'light', lang: 'en' },
    ];

    // 지금 열린 주소를 기준으로 위젯 주소를 만든다. (로컬에서도, 배포 후에도 그대로 동작)
    const origin = window.location.origin;

    // user를 빼면 잠금 없이 '그날의 공통 운세'가 나온다. 미리보기는 이걸로 보여준다.
    function widgetUrl({ theme, lang }, user, extra = {}) {
      const params = new URLSearchParams({ ...(user ? { user } : {}), theme, ...extra });
      if (lang !== 'ko') params.set('lang', lang); // 한국어는 기본값이라 생략한다.
      return `${origin}/api?${params}`;
    }

    // README에 붙일 코드: 이미지 한 줄
    function readmeCode(example) {
      const alt = example.lang === 'en' ? "Today's fortune" : '오늘의 운세';
      return `![${alt}](${widgetUrl(example, 'YOUR_GITHUB_ID')})`;
    }

    // 다크/라이트 자동 전환 코드: GitHub 화면 모드에 맞춰 위젯 테마가 바뀐다 (추천)
    function autoThemeCode() {
      const user = 'YOUR_GITHUB_ID';
      return [
        '<picture>',
        `  <source media="(prefers-color-scheme: dark)" srcset="${widgetUrl({ theme: 'dark', lang: 'ko' }, user)}">`,
        `  <img src="${widgetUrl({ theme: 'light', lang: 'ko' }, user)}" alt="오늘의 운세">`,
        '</picture>',
      ].join('\n');
    }

    // 버튼을 누르면 코드를 클립보드에 복사하고 잠깐 "복사됨!"을 보여준다.
    async function copy(button, text) {
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = '복사됨!';
      } catch {
        button.textContent = '복사 실패 :( 코드를 직접 선택해 주세요';
      }
      setTimeout(() => { button.textContent = '코드 복사'; }, 1500);
    }

    // 미리보기 이미지. 누르면 위젯을 다시 불러와 쿠키가 갈라지는 애니메이션을 처음부터 보여준다.
    function renderPreview(example) {
      const figure = document.createElement('figure');
      figure.style.margin = '0';
      const img = document.createElement('img');
      img.src = widgetUrl(example);
      img.alt = `${example.title} 예시 위젯`;
      img.width = 495;
      img.title = '눌러서 애니메이션 다시 보기';
      img.addEventListener('click', () => { img.src = widgetUrl(example, null, { t: Date.now() }); });
      const caption = document.createElement('figcaption');
      caption.textContent = '커밋한 날의 모습 · 눌러서 다시 보기';
      figure.append(img, caption);
      return figure;
    }

    // 코드 상자 + 복사 버튼
    function renderCodeBox(text, label) {
      const codeBox = document.createElement('div');
      codeBox.className = 'code';
      const pre = document.createElement('pre');
      pre.textContent = text;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = '코드 복사';
      button.setAttribute('aria-label', `${label} 코드 복사`);
      button.addEventListener('click', () => copy(button, text));
      codeBox.append(pre, button);
      return codeBox;
    }

    const grid = document.getElementById('examples');

    // 맨 위: 다크/라이트 자동 전환 추천 카드
    {
      const card = document.createElement('article');
      card.className = 'example featured';
      const title = document.createElement('h2');
      title.textContent = '추천 · 다크/라이트 자동 전환 (보는 사람의 GitHub 화면 모드에 맞춤)';
      const pair = document.createElement('div');
      pair.className = 'pair';
      for (const theme of ['dark', 'light']) {
        const preview = document.createElement('div');
        preview.className = `preview ${theme}`;
        preview.append(renderPreview({ title: theme === 'dark' ? '다크 모드에서' : '라이트 모드에서', theme, lang: 'ko' }));
        pair.append(preview);
      }
      card.append(title, pair, renderCodeBox(autoThemeCode(), '자동 전환'));
      grid.append(card);
    }

    for (const example of EXAMPLES) {
      const card = document.createElement('article');
      card.className = 'example';

      const title = document.createElement('h2');
      title.textContent = example.title;

      const preview = document.createElement('div');
      preview.className = `preview ${example.theme}`;
      preview.append(renderPreview(example));

      card.append(title, preview, renderCodeBox(readmeCode(example), example.title));
      grid.append(card);
    }
  </script>
</body>
</html>
